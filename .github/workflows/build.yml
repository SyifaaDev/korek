name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "main.cpp"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Debug files
        shell: msys2 {0}
        run: |
          pwd
          ls -la
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

      - name: Compile
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la main.cpp
          g++ -std=c++17 -O2 -municode -mwindows \
            -DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 \
            main.cpp -o BackupUploader.exe \
            -lwinhttp -lbcrypt -lcomctl32 -luser32 -lgdi32 -lole32 -lshell32 \
            -static -static-libgcc -static-libstdc++

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackupUploader
          path: BackupUploader.exe
